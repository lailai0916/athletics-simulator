name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out reviewed repository standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lailai0916/lailai-template
          ref: aab624269fb9cdf18b9da5d11605eb9b0fc79154
          path: .standards
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Validate repository standards
        run: python3 .standards/scripts/check_repository.py --root . --display-name 'Athletics Simulator'
      - name: Validate tracked filenames
        run: git ls-files -z | xargs -0 python3 .standards/scripts/check_repository.py --paths
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Upload offline application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: athletics-simulator-offline
          path: dist/index.html
          if-no-files-found: error
          retention-days: 14
